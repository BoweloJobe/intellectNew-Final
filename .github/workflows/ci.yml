name: CI

on:
  push:
    branches:
      - main
      - production-hardening
  pull_request:
    branches:
      - main
      - production-hardening

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:frontend

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellectx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intellectx_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intellectx_ci?schema=public
      JWT_SECRET: test-secret-at-least-32-characters-long
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Validate Prisma schema
        run: npm run db:validate --prefix backend

      - name: Generate Prisma client
        run: npm run db:generate --prefix backend

      - name: Deploy Prisma migrations
        run: npm run db:migrate:deploy --prefix backend

      - name: Typecheck
        run: npm run typecheck --prefix backend

      - name: Test
        run: npm test --prefix backend

      - name: Build
        run: npm run build --prefix backend
